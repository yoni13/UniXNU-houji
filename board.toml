schema_version = 2

[board]
name = "houji"
soc = "SM8650"
soc_source = "sm8550"
description = "Xiaomi 14 23127PN0CC (houji)"
kit = "houji"
os_profile = "ios-27.2.1-24B156"

# The GPT entry "userdata" of this phone (stock OS3.0.303.0 layout): fastboot reports 0x786A1FB000 bytes of 4096-byte blocks.
[userdata]
first_lba = 2362880
last_lba = 128626682
lba_bytes = 4096

[components]
include = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot", "GopFramebuffer", "AppleKeyStoreState", "Adreno740", "Ath12kWifi"]

[kernel]
defconfig = "houji_ios27_defconfig"
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "build-libpthread-kernel.py",
  # Adreno 750: the generated board headers first (NativeAdrenoService.cpp includes them), then the driver, then its kits and the
  # local firmware (scripts/build-houji-adreno.py, UNIXNU_HOUJI_GPU_INPUTS). Nothing runs without gpu-power=<n>.
  "build-houji-adreno.py inputs",
  "component:Adreno740",
  "build-houji-adreno.py kits",
  # Wi-Fi: the Ath12kWifi driver compiled for this kernel, not linked yet (docs/wifi.md).
  "build-ath12k-wifi.py drivers/Ath12kWifi build/ath12k-wifi",
  "build-houji-kit.py",
  "component:AppleKeyStoreState",
  "build-houji-display.py",
  "build-fileset-release-reference.py --tree . --lto",
]
config_fragments = ["arch:configs/common.config", "os:configs/ios.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu-12377/series", "os:patches/xnu/series", "device:patches/xnu/series"]

[device_tree]
source = "device:dts/houji.dts"
include_dirs = ["soc:dts"]

[firmware]
config = "houji"
dsc = "Platforms/Xiaomi/houjiPkg/houji.dsc"
fd = "Build/houjiPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"

[firmware.defines]
DEVICE_MODEL = "0"
ENABLE_SECUREBOOT = "0"
FD_BASE = "0xA7100000"
FD_SIZE = "0x300000"
FD_BLOCKS = "0x300"

[package]
unixnu = "../UniXNU"

[package.defconfig]
"ios-27.2.1-24B156" = "houji_ios27_defconfig"

# The identity and layout of the target product (iPhone17,1 D93AP DeviceTree of 24B156, /product), which MobileGestalt reads
# for the UI: the artwork subtype selects the iPhone 16 Pro screen class and assets, the island location the status bar. Only
# descriptive properties: none that claims hardware houji lacks (exclaves, LPM, camera button, Pearl, baseband, NFC, GPU class).
[adt.product]
[adt.product.string]
model = "xiaomi,houji"
product-name = "iPhone 16 Pro"
product-description = "iPhone 16 Pro"
unique-model = "D93AP"
sub-product-type = "iPhone17,1"
compatible-device-fallback = "iPhone16,1"
artwork-device-idiom = "phone"
artwork-display-gamut = "P3"
app-macho-architecture = "arm64e"
partition-style = "iOS"
[adt.product.u32]
thin-bezel = 1
artwork-device-subtype = 2622
artwork-scale-factor = 3
artwork-dynamic-displaymode = 0
island-notch-location = 144
oled-display = 1
large-format-phone = 0
ui-reachability = 1
[adt.product.bytes]
# D93AP: two u32, 62 and 1.
display-corner-radius = "3e00000001000000"

# No Home button: SpringBoard's lock screen, home and switcher are the gesture ones (D93AP /buttons home-button-type = 2).
# Descriptive only, no compatible or button functions, so no button driver matches it.
[adt.buttons]
[adt.buttons.u32]
home-button-type = 2
opposed-power-vol-buttons = 1

[adt.defaults]
[adt.defaults.u32]
sleep-disabled = 1
# No Apple PMGR or SEP: report a virtual platform, so AMFI does not wait for an ApplePMGRNub (as on sheng).
vmm-present = 1

[adt.chosen.u32]
# SM8650 has no CTRR: kernel text stays writable by hardware.
kernel-ctrr-to-be-enabled = 0

# Stage 0: everything runs from RAM, nothing is written to UFS.
[payload]
root_policies = "{out}/root-policies.bin"
# The firmware RAM disk driver of this phone looks for this FAT label.
volume = "HOUJIESP"
size_mib = 128
loader = "firmware"
title = "houji iOS 27.2.1"
# Equals the DTS memory node: the contiguous range at 0x8C0000000 of the firmware's high RAM.
dram_size = "0x80000000"
# The panic screen holds the panel and never restarts (docs/guide/debugging.md); with the USB console a panic is sent to
# the PC and the phone restarts into fastboot instead. Set true to photograph a panic that happens before the console starts.
panic_screen = false
# debug: 0x14e as on sheng plus DB_REBOOT_ALWAYS (0x100000), so a panic restarts instead of waiting for a debugger.
# houji_usb=1: the USB debug console. houji_reboot_bootloader=1: every restart, also after a panic, stops in fastboot.
# use_contiguous_hint=0: without it machine_lockdown panics (arm_vm_init.c:1107, the contiguous hint of the bootstrap mapping
# differs from the page-granular remap), photographed on this phone 2026-11-15. -no_slto_panic as on sheng.
kernel_args = ["-v", "serial=3", "debug=0x10014e", "kt_fixed_zones=120", "-no_slto_panic", "use_contiguous_hint=0", "houji_usb=1", "houji_reboot_bootloader=1"]

[payload.adt]
# T8140, the chip of iPhone17,1.
chip_id = "8140"
owned_memory_size = "0x80000000"
packed_data_ramdisk = true
persistent_data = false

[bootimg.image]
header_version = 4
os_version = "16.0.0"
os_patch_level = "2026-08"
