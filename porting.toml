[[area]]
id = "storage"
status = "implemented"
components = []
paths = ["drivers/ShengUfs", "package/SourceStorage.cpp", "package/SourceRoot*.cpp", "package/GiuliaSmmuTakeover.h", "scripts/*ufs*", "scripts/*storage*", "scripts/*userdata*", "scripts/*root*", "scripts/policies/**"]
inputs = ["Identify the storage and root hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for storage and root."]
procedure = ["Follow the storage and root stage in the porting guide and record the actual commands."]
findings = ["The iPhone17,1 24B156 OS and SystemOS windows have independent signed policy headers and block-hash tables. scripts/add-root-tables.py checks the input window hashes and signed table digests before appending OS.vroot and SystemOS.vroot as private SHNGROOT v2 data objects (block size 4096, flags 3). The original windows-only image is retained. This is offline image assembly, not UFS or APFS runtime qualification.", "scripts/prepare-houji-ufs.py adapts ShengUfs 99d8bcd3e43dd24fc3c8437c67b5d4cc71ab94d0 into a local read-only source tree. It reuses the legacy houji exact-SID SMMU retarget planner only after queue quiescence, preserves the firmware context, disables sheng WiFi/display mappings, and rejects writes at both hostWrite4k and hostSubmit. scripts/test-houji-ufs-smmu.cpp exercises retargeting and refusal on changed ownership or a nonquiescent queue. No kernel compilation or hardware qualification is implied."]
completion = ["Host: register, clock, link and SMMU facts match the board inventory.", "Reads: SCSI capacity, GPT and known blocks are correct; OS/SystemOS windows stay within userdata.", "Root: the configured volume mounts and launchd starts. Persistence: writes survive reboot within the allocated Data region."]
limits = ["No iOS 27 UFS driver linked or hardware-qualified yet; APFS root mount, Data persistence and launchd remain unverified. Hash tables and OS images remain local inputs outside this repository. The table assembly tool relies on previously C-verified policy headers; it does not independently verify RSA signatures."]
next_action = ["Compile the full archive with scripts/compile-houji-ufs.py --archive: late base/UFS/RAM class registration, houji startup, authenticated policy handoff, root binding, C verifier and XNU crypto provider. Houji startup deliberately excludes sheng logging and benchmarks and remains disabled without native-source-storage=1. Then qualify retained 24B156 dispatch/PAC ABI before kernel linkage and bounded read-only hardware tests."]
evidence = [{kind = "source", reference = "scripts/add-root-tables.py", result = "Offline windows and table identity checks, capacity bounds, exclusive output creation, and post-write table hash checks."}, {kind = "source", reference = "scripts/test-add-root-tables.py", result = "Synthetic tests cover version-2 layout, no overwrite, corrupted windows/tables and insufficient capacity; not cryptographic or hardware qualification."}]

