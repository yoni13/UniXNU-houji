# iPhone 16 Pro (iPhone17,1) iOS 27.2.1. Derived from UniXNU's ipados-27.0.1-24A446 profile: no XNU source newer than
# xnu-12377 is published, so the kernel source and the Darwin 26 system-call patches are shared; the IPSW, the original
# kexts (and every address taken from the kernelcache) and the identity are this build's.
"xnu_version" = "12377.121.6"
"xnu_revision" = "ac9718fb1af618d5ce8678d0dc6e8a58f252216f"
# 12377 carries iokit/DriverKit; EXTERNAL_HEADERS/TrustCache comes from the last tag that ships it.
"driverkit_tag" = "xnu-12377.121.6"
"trustcache_tag" = "xnu-8796.101.5"
"ios_version" = "27.2"
"abi" = []


["ipsw"]
# 12992259527 bytes, sha256 e2916731a8d655d3d2d5aec75ebab1fde569a2fe3aa01092ac096d75582bea8d.
"url" = "https://updates.cdn-apple.com/2026FallFCS/a75ca3b6-83d4-440d-99fc-99ecb7406750/iPhone17,1_27.2.1_24B156_Restore.ipsw"
